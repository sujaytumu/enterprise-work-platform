apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-processing-engine
  labels:
    app: core-processing-engine
spec:
  replicas: 3
  selector:
    matchLabels:
      app: core-processing-engine
  template:
    metadata:
      labels:
        app: core-processing-engine
    spec:
      containers:
        - name: core-processing-engine
          # Replace with your registry path after `docker push`, e.g.:
          # ghcr.io/sujaytumu/core-processing-engine:latest
          image: REPLACE_ME/core-processing-engine:latest
          ports:
            - containerPort: 8081
          envFrom:
            - secretRef:
                name: payments-db-secret
            - configMapRef:
                name: payments-config
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 40
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: core-processing-engine
spec:
  selector:
    app: core-processing-engine
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP

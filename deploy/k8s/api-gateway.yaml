apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          # Replace with your registry path after "docker push", e.g.:
          # ghcr.io/sujaytumu/api-gateway:latest
          image: REPLACE_ME/api-gateway:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: payments-config
          env:
            # Point this at a real OAuth2/OIDC provider before deploying
            # anywhere reachable outside your own machine — see
            # api-gateway/src/main/java/.../config/SecurityConfig.java
            - name: OAUTH2_ISSUER_URI
              valueFrom:
                configMapKeyRef:
                  name: payments-config
                  key: OAUTH2_ISSUER_URI
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
  # Only the gateway needs to be reachable from outside the cluster.
  # Real deployments would front this with an mTLS-terminating
  # LoadBalancer/Ingress rather than exposing it directly — see
  # docs/ARCHITECTURE.md.
  type: ClusterIP

# One public web application + one private Render PostgreSQL database.
services:
  - type: web
    name: enterprise-work-platform-live
    runtime: node
    region: singapore
    plan: free
    branch: main
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: enterprise-platform-live-db
          property: connectionString

databases:
  - name: enterprise-platform-live-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"

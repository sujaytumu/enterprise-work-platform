server:
  port: 8082

spring:
  application:
    name: payment-switch
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

issuer:
  core-processing-engine:
    url: ${CORE_ENGINE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.enterprise.switchsvc: INFO

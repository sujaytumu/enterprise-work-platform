apiVersion: apps/v1
kind: Deployment
metadata:
  name: clearing-settlement
  labels:
    app: clearing-settlement
spec:
  replicas: 3
  selector:
    matchLabels:
      app: clearing-settlement
  template:
    metadata:
      labels:
        app: clearing-settlement
    spec:
      containers:
        - name: clearing-settlement
          # Replace with your registry path after "docker push", e.g.:
          # ghcr.io/sujaytumu/clearing-settlement:latest
          image: REPLACE_ME/clearing-settlement:latest
          ports:
            - containerPort: 8086
          envFrom:
            - secretRef:
                name: payments-db-secret
            - configMapRef:
                name: payments-config
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            initialDelaySeconds: 40
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: clearing-settlement
spec:
  selector:
    app: clearing-settlement
  ports:
    - port: 8086
      targetPort: 8086
  type: ClusterIP

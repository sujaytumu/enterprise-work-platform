server:
  port: 8083

spring:
  application:
    name: fraud-risk-engine
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:paymentsdb}
    username: ${DB_USER:payments}
    password: ${DB_PASSWORD:payments}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

fraud:
  thresholds:
    block: 0.75
    review: 0.4

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.enterprise.fraud: INFO

version: "3.8"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paymentsdb
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d paymentsdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  core-processing-engine:
    build: ./core-processing-engine
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: paymentsdb
      DB_USER: payments
      DB_PASSWORD: payments
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  payment-switch:
    build: ./payment-switch
    depends_on:
      - kafka
      - core-processing-engine
    ports:
      - "8082:8082"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CORE_ENGINE_URL: http://core-processing-engine:8081

  fraud-risk-engine:
    build: ./fraud-risk-engine
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: paymentsdb
      DB_USER: payments
      DB_PASSWORD: payments
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  tokenization-vault:
    build: ./tokenization-vault
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8084:8084"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: paymentsdb
      DB_USER: payments
      DB_PASSWORD: payments
      # Demo key only — see tokenization-vault/src/main/resources/application.yml
      VAULT_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

  card-management:
    build: ./card-management
    depends_on:
      - postgres
      - tokenization-vault
    ports:
      - "8085:8085"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: paymentsdb
      DB_USER: payments
      DB_PASSWORD: payments
      VAULT_URL: http://tokenization-vault:8084

  clearing-settlement:
    build: ./clearing-settlement
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8086:8086"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: paymentsdb
      DB_USER: payments
      DB_PASSWORD: payments
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  api-gateway:
    build: ./api-gateway
    depends_on:
      - core-processing-engine
      - payment-switch
      - fraud-risk-engine
      - tokenization-vault
      - card-management
      - clearing-settlement
    ports:
      - "8080:8080"
    # nosecurity profile: local demo only, disables JWT validation.
    # Remove this env var (and configure OAUTH2_ISSUER_URI instead) for
    # anything beyond your own machine.
    environment:
      SPRING_PROFILES_ACTIVE: nosecurity
      CORE_ENGINE_URL: http://core-processing-engine:8081
      SWITCH_URL: http://payment-switch:8082
      FRAUD_URL: http://fraud-risk-engine:8083
      VAULT_URL: http://tokenization-vault:8084
      CMS_URL: http://card-management:8085
      SETTLEMENT_URL: http://clearing-settlement:8086

  client:
    build: ./client
    depends_on:
      api-gateway:
        condition: service_started
    ports:
      - "3000:80"

volumes:
  pgdata:

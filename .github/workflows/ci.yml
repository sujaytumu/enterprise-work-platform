name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-core-processing-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {java-version: "17", distribution: "temurin", cache: maven}
      - name: Build and test
        working-directory: core-processing-engine
        run: mvn -B clean verify

  build-payment-switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {java-version: "17", distribution: "temurin", cache: maven}
      - name: Build and test
        working-directory: payment-switch
        run: mvn -B clean verify

  build-fraud-risk-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {java-version: "17", distribution: "temurin", cache: maven}
      - name: Build and test
        working-directory: fraud-risk-engine
        run: mvn -B clean verify

  build-tokenization-vault:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {java-version: "17", distribution: "temurin", cache: maven}
      - name: Build and test
        working-directory: tokenization-vault
        run: mvn -B clean verify

  build-card-management:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {java-version: "17", distribution: "temurin", cache: maven}
      - name: Build and test
        working-directory: card-management
        run: mvn -B clean verify

  build-clearing-settlement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {java-version: "17", distribution: "temurin", cache: maven}
      - name: Build and test
        working-directory: clearing-settlement
        run: mvn -B clean verify

  build-api-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {java-version: "17", distribution: "temurin", cache: maven}
      - name: Build and test
        working-directory: api-gateway
        run: mvn -B clean verify

  build-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install and build client
        working-directory: client
        run: |
          npm ci
          CI=false npm run build

  docker-build:
    needs: [build-core-processing-engine, build-payment-switch, build-fraud-risk-engine, build-tokenization-vault, build-card-management, build-clearing-settlement, build-api-gateway, build-client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build core-processing-engine image
        run: docker build -t core-processing-engine:ci ./core-processing-engine
      - name: Build payment-switch image
        run: docker build -t payment-switch:ci ./payment-switch
      - name: Build fraud-risk-engine image
        run: docker build -t fraud-risk-engine:ci ./fraud-risk-engine
      - name: Build tokenization-vault image
        run: docker build -t tokenization-vault:ci ./tokenization-vault
      - name: Build card-management image
        run: docker build -t card-management:ci ./card-management
      - name: Build clearing-settlement image
        run: docker build -t clearing-settlement:ci ./clearing-settlement
      - name: Build api-gateway image
        run: docker build -t api-gateway:ci ./api-gateway

      - name: Build client image
        run: docker build -t payment-platform-client:ci ./client

  runtime-smoke:
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Start complete platform
        run: docker compose up -d --build
      - name: Run runtime smoke test
        run: bash scripts/smoke-test.sh
      - name: Run synthetic end-to-end demo
        run: DIRECT_E2E=true bash scripts/e2e-demo.sh
      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop platform
        if: always()
        run: docker compose down -v
